[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hangar"
version = "0.1.0"
description = "Shared RunPod pod-lifecycle library: create/resume/status/stop pods with no project-specific settings coupling"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hangar"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
